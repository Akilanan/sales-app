# Nightly database backup — Supabase free tier has NO managed backups.
# pg_dump over the Session Pooler (IPv4 — required: GitHub runners are IPv4,
# direct db.<ref>.supabase.co is IPv6-only on free tier), gzipped, stored as a
# GitHub Actions artifact (90-day retention, private repo).
#
# Only ONE repo secret needed: SUPABASE_DB_PASSWORD — your database password.
# (Host/port/user are NOT secret and are set below. Password-as-PGPASSWORD
# avoids URL-encoding pitfalls when the password contains @ : / # etc.)
# Connection facts confirmed from the dashboard Connect → Session pooler:
#   host=aws-1-ap-northeast-1.pooler.supabase.com  port=5432
#   user=postgres.czfhyqvpfulpwpsgempf  db=postgres
name: Nightly DB backup

on:
  schedule:
    - cron: "47 21 * * *" # daily 21:47 UTC (~03:17 IST)
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Install postgresql-client-17 (server is PG17; client must match)
        run: |
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -yqq postgresql-client-17

      - name: pg_dump (schema + data, no owners/grants)
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          ts=$(date -u +%Y%m%d-%H%M%S)
          /usr/lib/postgresql/17/bin/pg_dump \
            --host=aws-1-ap-northeast-1.pooler.supabase.com \
            --port=5432 \
            --username=postgres.czfhyqvpfulpwpsgempf \
            --dbname=postgres \
            --no-owner --no-privileges -f "backup-$ts.sql"
          gzip "backup-$ts.sql"
          ls -la backup-*.sql.gz

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backup-*.sql.gz
          retention-days: 90
          if-no-files-found: error
